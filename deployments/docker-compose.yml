name: edgeguard

services:
  gateway:
    build:
      context: ..
      dockerfile: deployments/docker/gateway.Dockerfile
    container_name: edgeguard-gateway
    environment:
      GATEWAY_CONFIG_PATH: /app/configs/gateway.docker.yaml
    ports:
      - "8080:8080"
    depends_on:
      demo-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  demo-backend:
    build:
      context: ..
      dockerfile: deployments/docker/demo-backend.Dockerfile
    container_name: edgeguard-demo-backend
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
