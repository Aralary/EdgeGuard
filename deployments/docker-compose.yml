name: edgeguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: edgeguard-postgres
    environment:
      POSTGRES_USER: edgeguard
      POSTGRES_PASSWORD: edgeguard
      POSTGRES_DB: edgeguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeguard -d edgeguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deployments/docker/migrations.Dockerfile
    container_name: edgeguard-migrate
    environment:
      GOOSE_DBSTRING: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  control-plane:
    build:
      context: ..
      dockerfile: deployments/docker/control-plane.Dockerfile
    container_name: edgeguard-control-plane
    environment:
      CONTROL_PLANE_HTTP_ADDR: ":8082"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: deployments/docker/auth.Dockerfile
    container_name: edgeguard-auth
    environment:
      AUTH_HTTP_ADDR: ":8083"
      AUTH_JWT_SECRET: edgeguard-development-jwt-secret-change-me-1234567890
      AUTH_JWT_ISSUER: edgeguard-auth
      AUTH_JWT_AUDIENCE: edgeguard
      AUTH_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 720h
      AUTH_REFRESH_TOKEN_SIZE: "32"
      AUTH_BCRYPT_COST: "10"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deployments/docker/gateway.Dockerfile
    container_name: edgeguard-gateway
    environment:
      GATEWAY_CONFIG_PATH: /app/configs/gateway.docker.yaml
      CONTROL_PLANE_URL: http://control-plane:8082
      ROUTES_REFRESH_INTERVAL: 10s
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      demo-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  demo-backend:
    build:
      context: ..
      dockerfile: deployments/docker/demo-backend.Dockerfile
    container_name: edgeguard-demo-backend
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
