name: edgeguard

services:
  postgres:
    image: postgres:16-alpine
    container_name: edgeguard-postgres
    environment:
      POSTGRES_USER: edgeguard
      POSTGRES_PASSWORD: edgeguard
      POSTGRES_DB: edgeguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeguard -d edgeguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deployments/docker/migrations.Dockerfile
    container_name: edgeguard-migrate
    environment:
      GOOSE_DBSTRING: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"

  control-plane:
    build:
      context: ..
      dockerfile: deployments/docker/control-plane.Dockerfile
    container_name: edgeguard-control-plane
    environment:
      CONTROL_PLANE_HTTP_ADDR: ":8082"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
      RABBITMQ_URL: amqp://edgeguard:edgeguard@rabbitmq:5672/edgeguard
      JOBS_EXCHANGE: edgeguard.jobs.v1
      JOBS_QUEUE: edgeguard.jobs.main.v1
      JOBS_PUBLISH_TIMEOUT: 5s
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth:
    build:
      context: ..
      dockerfile: deployments/docker/auth.Dockerfile
    container_name: edgeguard-auth
    environment:
      AUTH_HTTP_ADDR: ":8083"
      AUTH_JWT_SECRET: edgeguard-development-jwt-secret-change-me-1234567890
      AUTH_JWT_ISSUER: edgeguard-auth
      AUTH_JWT_AUDIENCE: edgeguard
      AUTH_ACCESS_TOKEN_TTL: 15m
      AUTH_REFRESH_TOKEN_TTL: 720h
      AUTH_REFRESH_TOKEN_SIZE: "32"
      AUTH_BCRYPT_COST: "10"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "10"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    container_name: edgeguard-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: edgeguard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: edgeguard
      RABBITMQ_DEFAULT_PASS: edgeguard
      RABBITMQ_DEFAULT_VHOST: edgeguard
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  notification-worker:
    build:
      context: ..
      dockerfile: deployments/docker/notification-worker.Dockerfile
    container_name: edgeguard-notification-worker
    environment:
      RABBITMQ_URL: amqp://edgeguard:edgeguard@rabbitmq:5672/edgeguard
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USERNAME: edgeguard
      RABBITMQ_PASSWORD: edgeguard
      RABBITMQ_VHOST: edgeguard
      JOBS_EXCHANGE: edgeguard.jobs.v1
      JOBS_QUEUE: edgeguard.jobs.main.v1
      JOBS_DEAD_EXCHANGE: edgeguard.jobs.dead.v1
      JOBS_DEAD_QUEUE: edgeguard.jobs.dead.v1
      JOBS_WORKER_PREFETCH: "10"
      JOBS_RETRY_MIN: 5s
      JOBS_RETRY_MAX: 60s
      JOBS_PROCESS_TIMEOUT: 2m
      JOBS_WEBHOOK_TIMEOUT: 15s
      JOBS_WEBHOOK_ALLOWED_HOSTS: demo-backend
      JOBS_REPORT_DIRECTORY: /data/reports
      JOBS_POLICY_INSTALL_TIMEOUT: 30s
      JOBS_OBSERVABILITY_ADDR: ":8085"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "5"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "8085:8085"
    volumes:
      - reports_data:/data/reports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: edgeguard-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: edgeguard-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ACCESS_TOPIC: edgeguard.gateway.access.v1
      KAFKA_ACCESS_TOPIC_PARTITIONS: "3"
      KAFKA_ACCESS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_INIT_MAX_ATTEMPTS: "30"
      KAFKA_INIT_RETRY_INTERVAL_SECONDS: "2"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        topic="$${KAFKA_ACCESS_TOPIC}"
        bootstrap_servers="$${KAFKA_BOOTSTRAP_SERVERS}"
        partitions="$${KAFKA_ACCESS_TOPIC_PARTITIONS}"
        replication_factor="$${KAFKA_ACCESS_TOPIC_REPLICATION_FACTOR}"
        max_attempts="$${KAFKA_INIT_MAX_ATTEMPTS}"
        retry_interval="$${KAFKA_INIT_RETRY_INTERVAL_SECONDS}"
        kafka_topics=/opt/kafka/bin/kafka-topics.sh

        echo "Initializing Kafka topic: $${topic}"

        for ((attempt = 1; attempt <= max_attempts; attempt++)); do
          if "$${kafka_topics}" \
            --bootstrap-server "$${bootstrap_servers}" \
            --describe \
            --topic "$${topic}" >/dev/null 2>&1; then
            echo "Kafka topic is ready: $${topic}"
            exit 0
          fi

          echo "Creating Kafka topic: topic=$${topic} attempt=$${attempt}/$${max_attempts}"

          if ! "$${kafka_topics}" \
            --bootstrap-server "$${bootstrap_servers}" \
            --create \
            --topic "$${topic}" \
            --partitions "$${partitions}" \
            --replication-factor "$${replication_factor}"; then
            echo "Kafka topic creation attempt failed" >&2
          fi

          if "$${kafka_topics}" \
            --bootstrap-server "$${bootstrap_servers}" \
            --describe \
            --topic "$${topic}" >/dev/null 2>&1; then
            echo "Kafka topic created and verified: $${topic}"
            exit 0
          fi

          sleep "$${retry_interval}"
        done

        echo "Kafka topic was not created after $${max_attempts} attempts: $${topic}" >&2
        exit 1
    restart: "no"

  analytics-worker:
    build:
      context: ..
      dockerfile: deployments/docker/analytics-worker.Dockerfile
    container_name: edgeguard-analytics-worker
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_ACCESS_TOPIC: edgeguard.gateway.access.v1
      ANALYTICS_KAFKA_GROUP: edgeguard-analytics-v1
      ANALYTICS_KAFKA_CLIENT_ID: edgeguard-analytics-worker
      ANALYTICS_RETRY_MIN: 1s
      ANALYTICS_RETRY_MAX: 30s
      ANALYTICS_MAX_PROCESS_ATTEMPTS: "5"
      ANALYTICS_HTTP_ADDR: ":8084"
      POSTGRES_DSN: postgres://edgeguard:edgeguard@postgres:5432/edgeguard?sslmode=disable
      POSTGRES_MAX_CONNS: "5"
      POSTGRES_MIN_CONNS: "1"
      POSTGRES_MAX_CONN_LIFETIME_SECONDS: "300"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: deployments/docker/gateway.Dockerfile
    container_name: edgeguard-gateway
    environment:
      GATEWAY_CONFIG_PATH: /app/configs/gateway.docker.yaml
      CONTROL_PLANE_URL: http://control-plane:8082
      AUTH_SERVICE_URL: http://auth:8083
      REDIS_URL: redis://redis:6379/0
      REDIS_RATE_LIMIT_PREFIX: edgeguard:rate-limit
      ROUTES_REFRESH_INTERVAL: 10s
      KAFKA_BROKERS: kafka:9092
      KAFKA_ACCESS_TOPIC: edgeguard.gateway.access.v1
      KAFKA_CLIENT_ID: edgeguard-gateway
    ports:
      - "8080:8080"
    depends_on:
      control-plane:
        condition: service_healthy
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      demo-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  demo-backend:
    build:
      context: ..
      dockerfile: deployments/docker/demo-backend.Dockerfile
    container_name: edgeguard-demo-backend
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/ready"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: edgeguard-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  rabbitmq_data:
  reports_data:
  prometheus_data:
