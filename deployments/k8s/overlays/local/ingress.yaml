apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edgeguard
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: edgeguard
spec:
  ingressClassName: cloud-provider-kind
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              name: http
