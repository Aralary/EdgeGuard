apiVersion: batch/v1
kind: Job
metadata:
  name: edgeguard-migrations
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: migrations
    app.kubernetes.io/component: database-migrations
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrations
        app.kubernetes.io/component: database-migrations
    spec:
      serviceAccountName: edgeguard-app
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -ec
        - |
          until pg_isready --host=postgres --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"; do
            echo "Waiting for PostgreSQL"
            sleep 2
          done
          echo "PostgreSQL is ready"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_DB
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      containers:
      - name: migrations
        image: ghcr.io/aralary/edgeguard-migrate:latest
        imagePullPolicy: IfNotPresent
        args:
        - up
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_DB
        - name: GOOSE_DBSTRING
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
