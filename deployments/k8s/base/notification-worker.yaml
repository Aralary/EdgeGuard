apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: edgeguard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: edgeguard
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8085'
    spec:
      serviceAccountName: edgeguard-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: notification-worker
        image: ghcr.io/aralary/edgeguard-notification-worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8085
          protocol: TCP
        envFrom:
        - configMapRef:
            name: edgeguard-config
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 2
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: POSTGRES_DB
        - name: POSTGRES_DSN
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable
        - name: RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: RABBITMQ_USERNAME
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: RABBITMQ_PASSWORD
        - name: RABBITMQ_VHOST
          valueFrom:
            secretKeyRef:
              name: edgeguard-secrets
              key: RABBITMQ_VHOST
        - name: RABBITMQ_URL
          value: amqp://$(RABBITMQ_USERNAME):$(RABBITMQ_PASSWORD)@rabbitmq:5672/$(RABBITMQ_VHOST)
        volumeMounts:
        - name: reports
          mountPath: /data/reports
      volumes:
      - name: reports
        persistentVolumeClaim:
          claimName: reports-data
---
apiVersion: v1
kind: Service
metadata:
  name: notification-worker
  namespace: edgeguard
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: edgeguard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: notification-worker
  ports:
  - name: http
    port: 8085
    targetPort: http
    protocol: TCP
